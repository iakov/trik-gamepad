# detekt configuration for trik-gamepad.
#
# build.gradle sets buildUponDefaultConfig = true, so this file only
# *deviates* from detekt's bundled default ruleset. Keep it minimal; any
# relaxation carries a rationale comment or a recorded entry in MEMORY.md
# (AGENTS.md suppression policy).

config:
  validation: true

build:
  # Fail the gate on any issue (strict, like checkstyle/pmd).
  maxIssues: 0

complexity:
  NestedBlockDepth:
    # Byte-parsing loops (MjpegInputStream.getEndOfSequence, MjpegView.renderNextFrame
    # read markers / match sequences and nest try/for/if/if naturally); a
    # faithful port keeps the recovery structure. Detekt's default is 4; this
    # stays 5 because those two parser/render functions cannot flatten without
    # a rewrite (Phase 2-J reverted the 5->4 tightening on that evidence).
    threshold: 5
  CyclomaticComplexMethod:
    # Legacy Android lifecycle methods (MainActivity.onCreate wires pads, menu,
    # settings listeners and the sensor/video paths) are inherently complex; the
    # Java equivalents passed checkstyle/pmd with the same shapes. Tightened
    # from 25 to 20 in Phase 2-J after the settings/wheel extraction moved the
    # biggest branches into MainActivitySettingsController / WheelController.
    threshold: 20
  LongMethod:
    # Same rationale as CyclomaticComplexMethod: faithful ports of large Android
    # lifecycle wiring methods. Tightened from 200 to 150 in Phase 2-J.
    threshold: 150
  TooManyFunctions:
    # Android protocol/activity classes legitimately expose a large method
    # surface (SenderService, MainActivity); the Java equivalents passed the
    # checkstyle/pmd gates with the same shapes. MainActivity additionally
    # implements SettingsUi (6 thin view/actionbar overrides) since Phase 2-E;
    # the threshold 25 keeps that adapter pattern within a class.
    thresholdInClasses: 25

style:
  ReturnCount:
    # Faithful Java→Kotlin ports of parser/network code legitimately use
    # early returns for sentinel values (e.g. "not found" / "give up") — the
    # Java originals did too. Raised from the default 2 so ports are not
    # contorted into single-return shapes that obscure the recovery flow.
    max: 3
  LoopWithTooManyJumpStatements:
    # Parser loops break on both "stream end" and "sequence found".
    maxJumpCount: 2
