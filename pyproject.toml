[project]
name = "trik-gamepad-tooling"
version = "0.1.0"
description = "Cross-platform dev tooling for trik-gamepad (gate, pre-commit, docs)"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "fonttools>=4.50,<5",
    "lizard==1.23.0",
    "mdformat==0.7.21",
    "pillow>=11,<13",
    "pre-commit",
]

# Python coding discipline (scripts/): correctness + clarity, no
# style-policing. E=PyCodeStyle, F=PyFlakes, W=whitespace, N=pep8-naming.
# BLE/S/DTZ/PLW are deliberately NOT selected: scripts/ use intentional
# blind-exception and naive-datetime patterns (cross-platform process
# teardown in run_bounded.py, user-facing log timestamps).
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "N"]

[tool.uv]
package = false
